# One virtual workspace (SPEC 19.1). The crate table there is the source of
# truth for what each crate owns and may depend on; xtask/tests/structure.rs
# enforces it.
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde_json = "1"
# Exact pin, default features off (SPEC 19.2).
pulldown-cmark = { version = "=0.13.6", default-features = false }
# Exact pins, for the fold of VAL-5d (SPEC 19.2).
icu_casemap = "=2.4.0"
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
# The config row (SPEC 19.2): toml without `display`, since nothing here
# writes TOML.
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
schemars = "1"
# The errors row (SPEC 19.2).
thiserror = "2"
# The rows of the async runtime and of processes (SPEC 19.2), the two pre-1.0
# crates pinned exactly. `process-wrap` brings `nix` in already; it signals
# the groups of the stop sequence and the shim's pipes.
tokio = "1"
tokio-util = "=0.7.20"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }
nix = { version = "=0.31.4", default-features = false, features = ["fs", "process", "signal"] }
# The seccomp row (SPEC 19.2), for Linux targets alone.
seccompiler = "=0.5.0"
# The CLI row (SPEC 19.2).
clap = { version = "4", features = ["derive"] }
# The testing row gives no version (SPEC 19.2). Without the default features,
# which fork and time out tests and read regular expressions.
proptest = { version = "1", default-features = false, features = ["std"] }

# SPEC 19.3. The disallowed methods are listed in clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
