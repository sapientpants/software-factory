[package]
name = "factory-sandbox"
description = "The Sandbox traits, SandboxPolicy and backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
factory-core = { path = "../factory-core" }
factory-proc = { path = "../factory-proc" }
thiserror.workspace = true

# The bubblewrap backend is compiled for Linux alone (SPEC 4.4).
[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true
seccompiler.workspace = true
# The status line of `bwrap --json-status-fd` (SEC-10a).
serde_json.workspace = true
# The first process forwards with tokio (SPEC 19.2).
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "signal", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { workspace = true, features = ["io-std", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true

# The sandbox tests of SPEC 19.4, at level `process`. A harness of its own:
# the binary is also the supervisor shim that its tests start, and its tests
# are ignored unless `SF_SANDBOX_TESTS` holds `process`, so that `cargo
# nextest run` runs none of them and the sandbox step of `cargo xtask check`
# runs them (DEV-2a).
[[test]]
name = "sandbox"
harness = false
